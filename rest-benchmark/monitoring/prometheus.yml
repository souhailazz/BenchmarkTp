global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'rest-benchmark'

scrape_configs:
  # Spring Boot Actuator Prometheus
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'rest-benchmark'

  # JMX Exporter (if using agent)
  - job_name: 'jmx-exporter'
    static_configs:
      - targets: ['host.docker.internal:9404']
        labels:
          application: 'rest-benchmark-jmx'

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

