spring.application.name=rest-benchmark

# Profile Selection (jersey, spring, or datarest)
spring.profiles.active=${VARIANT:spring}

# PostgreSQL Configuration (Local)
spring.datasource.url=jdbc:postgresql://localhost:5432/restbench
spring.datasource.username=postgres
spring.datasource.password=menotyou
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Configuration
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Hibernate L2 Cache - DISABLED for benchmark
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# Server Configuration
server.port=8080
server.compression.enabled=false
server.http2.enabled=false

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# JMX Configuration
spring.jmx.enabled=true

# Logging
logging.level.root=WARN
logging.level.com.projet.rest_benchmark=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
